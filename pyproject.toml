[project]
name = "gwpii"
version = "0.1.0"
description = "GridWorks private customer store: the only place a person is linked to a house"
readme = "README.md"
authors = [
    { name = "Jessica Millar", email = "jessica.lynn.millar@gmail.com" }
]
requires-python = ">=3.12,<3.13.0"
dependencies = [
    "alembic>=1.17.2",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.44",
]

[project.scripts]
gwpii = "gwpii.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.16.1",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwpii"]
